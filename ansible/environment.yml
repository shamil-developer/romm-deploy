- name: "🐳 Prepare Docker and library directories"
  hosts: localhost
  gather_facts: true
  tasks:
    - name: "🔎 Require Ubuntu or Debian"
      ansible.builtin.assert:
        that:
          - ansible_distribution in ['Ubuntu', 'Debian']
        fail_msg: This playbook supports Ubuntu and Debian servers.

    - name: "🔎 Validate library path"
      ansible.builtin.assert:
        that:
          - romm_env.ROMM_LIBRARY_PATH.startswith('/')
          - romm_env.ROMM_LIBRARY_PATH != '/'

    - name: "🔎 Check Docker"
      ansible.builtin.command: docker --version
      register: docker_check
      changed_when: false
      failed_when: false

    - name: "🔎 Check Docker Compose"
      ansible.builtin.command: docker compose version
      register: compose_check
      changed_when: false
      failed_when: false

    - name: "🐳 Install Docker and Compose if missing"
      when: docker_check.rc != 0 or compose_check.rc != 0
      block:
        - name: Install repository prerequisites
          ansible.builtin.apt:
            name: ca-certificates
            state: present
            update_cache: true

        - name: Create Docker keyring directory
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'

        - name: Download official Docker repository key
          ansible.builtin.get_url:
            url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
            dest: /etc/apt/keyrings/docker.asc
            mode: '0644'

        - name: Detect package architecture
          ansible.builtin.command: dpkg --print-architecture
          register: package_architecture
          changed_when: false

        - name: Configure official Docker repository
          ansible.builtin.copy:
            dest: /etc/apt/sources.list.d/romm-docker.list
            mode: '0644'
            content: >
              deb [arch={{ package_architecture.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
              https://download.docker.com/linux/{{ ansible_distribution | lower }}
              {{ ansible_distribution_release }} stable

        - name: Install Docker Engine and Compose plugin
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-compose-plugin
            state: present
            update_cache: true

    - name: "▶️ Enable Docker service"
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: "📁 Create persistent library directories"
      ansible.builtin.file:
        path: "{{ romm_env.ROMM_LIBRARY_PATH }}/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - roms/ps
        - roms/dos
        - roms/win9x
        - roms/gb
        - bios/ps

